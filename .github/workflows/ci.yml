name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-password
          MARIADB_DATABASE: taskforge_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.23.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create isolated test database env file
        run: |
          cat > apps/api/.env.test <<'EOF'
          TEST_DATABASE_URL="mysql://root:ci-password@127.0.0.1:3306/taskforge_test"
          EOF

      - name: Validate Prisma schema
        run: pnpm --filter @taskforge/api exec prisma validate

      - name: Apply test database migrations
        run: pnpm db:migrate:test

      - name: Check test database migration status
        run: pnpm db:status:test

      - name: Run unit and integration tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Check formatting
        run: pnpm format:check

      - name: Build
        run: pnpm build

  e2e:
    name: Browser E2E
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.23.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @taskforge/web exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test:e2e
